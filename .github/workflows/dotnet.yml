
name: RaceDay API Build and Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore API/RaceDayAPI.sln

      - name: Build solution
        run: dotnet build API/RaceDayAPI.sln --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test API/RaceDayAPI.sln --configuration Release --no-build --logger "console;verbosity=normal"
