name: RaceDay API Build and Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore API
        run: dotnet restore API/RaceDayAPI/RaceDayAPI.csproj

      - name: Restore tests
        run: dotnet restore API/RaceDayAPI.Tests/RaceDayAPI.Tests.csproj

      - name: Build API
        run: dotnet build API/RaceDayAPI/RaceDayAPI.csproj --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test API/RaceDayAPI.Tests/RaceDayAPI.Tests.csproj --configuration Release
